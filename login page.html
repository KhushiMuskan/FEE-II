<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login credentials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom,#cb1d3d, #ffa3d4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background:rgb(225, 225, 144);
            padding: 100px;
            border-radius: 50px;
            width: 250px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 10px ;
        }
        button {
            padding: 10px 25px;
            cursor: pointer;
        }
        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Login credentials </h2>
    
    <input type="text" id="login" placeholder="Enter email">
    <input type="password" id="pass" placeholder="Enter password">
    
    <button onclick="login()">submit</button>
    
    <div id="result">
        
    </div>
</div>

<script src="loginscript.js"></script>
</body>
</html>
